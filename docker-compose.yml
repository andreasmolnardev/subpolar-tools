services:
  subpolar:
    build: .
    ports:
      - "3005:3000"
    environment:
      SUBPOLAR_ADMIN_EMAIL: ${SUBPOLAR_ADMIN_EMAIL:?set in .env}
      SUBPOLAR_ADMIN_PASSWORD: ${SUBPOLAR_ADMIN_PASSWORD:?set in .env}
      SUBPOLAR_SECRET_KEY: ${SUBPOLAR_SECRET_KEY:?set in .env}
      SUBPOLAR_LOG_EMAIL_TOKENS: ${SUBPOLAR_LOG_EMAIL_TOKENS:-false}
      SUBPOLAR_ORIGIN: ${SUBPOLAR_ORIGIN:-http://localhost:3000}
      WORKSPACE_ROOT: ${SUBPOLAR_WORKSPACE_ROOT:-/var/lib/subpolar/workspaces}
    volumes:
      - subpolar-data:/app/pb_data
      # Required only by the internal sandbox manager, never exposed to callers.
      - /var/run/docker.sock:/var/run/docker.sock
      # This must be a host path also visible to Docker so sandbox bind mounts use the same worktree.
      - ${SUBPOLAR_WORKSPACE_ROOT:-/var/lib/subpolar/workspaces}:${SUBPOLAR_WORKSPACE_ROOT:-/var/lib/subpolar/workspaces}
volumes:
  subpolar-data:
